<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Jueh Tailoring</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#0B1345;--horizon:#E89A4C;--horizon-deep:#C15A3A;--canvas:#F7F4EC;--panel:#FFF;--ink:#101418;--soft:#4B5563;--hair:#DDD6C4;--focus:#2F6FED;--ok:#1B7A43;--err:#B3261E;--badge-new:#2F6FED;--badge-ongoing:#C15A3A;--badge-done:#1B7A43;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;animation:pgIn .45s ease both;}
@keyframes pgIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
body.out{animation:pgOut .35s ease forwards;}
@keyframes pgOut{to{opacity:0;transform:translateY(-14px)}}
h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}

header{background:var(--sky);color:#F2EFE6;border-bottom:3px solid var(--horizon);padding:16px 20px;}
header .inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;}
header h1{font-size:18px;flex:1;}
.admin-chip{background:var(--horizon-deep);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:3px;}
.btn-sm{padding:7px 14px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:opacity .2s;}
.btn-logout{background:rgba(255,255,255,.12);color:#F2EFE6;}
.btn-logout:hover{background:rgba(255,255,255,.22);}

main{padding:48px 0 80px;}
.wrap-gate{max-width:440px;margin:0 auto;}

.panel{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:28px;}
.panel h2{font-size:20px;margin-bottom:6px;text-align:center;}
.panel .sub{color:var(--soft);font-size:13px;margin-bottom:20px;text-align:center;}

/* Gate tabs */
.gate-tabs{display:flex;border-bottom:2px solid var(--hair);margin-bottom:20px;gap:0;}
.gate-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;}
.gate-tab.active{color:var(--sky);border-bottom-color:var(--sky);}
.gate-tab-pane{display:none;}
.gate-tab-pane.active{display:block;}
.gate-note{background:#FFF8EE;border:1px solid #F5DDB0;border-radius:5px;padding:10px 12px;font-size:12px;color:#7A4810;margin-bottom:14px;line-height:1.5;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;font-size:14px;border:1.5px solid var(--hair);border-radius:5px;font-family:inherit;background:var(--canvas);transition:border-color .2s;}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(47,111,237,.15);}
.field textarea{resize:vertical;min-height:70px;}
.btn-primary{width:100%;padding:12px;background:linear-gradient(90deg,var(--horizon-deep),var(--horizon));color:#1A1206;border:none;border-radius:5px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;transition:opacity .2s,transform .15s;margin-top:4px;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none;}
.err-msg{color:var(--err);font-size:13px;margin-top:10px;text-align:center;min-height:14px;}

/* Site control */
#siteControl{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:22px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.sc-label{font-size:14px;font-weight:600;}
.sc-desc{font-size:13px;color:var(--soft);margin-top:2px;}
.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle{appearance:none;width:48px;height:26px;border-radius:13px;background:var(--err);cursor:pointer;transition:background .25s;position:relative;}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .25s;}
.toggle:checked{background:var(--ok);}
.toggle:checked::after{transform:translateX(22px);}
.toggle-lbl{font-size:13px;font-weight:600;min-width:40px;color:var(--soft);}

/* Orders */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.toolbar input{flex:1;min-width:160px;padding:9px 13px;font-size:14px;border:1.5px solid var(--hair);border-radius:5px;font-family:inherit;background:var(--panel);}
.toolbar input:focus-visible{outline:none;border-color:var(--focus);}
.toolbar select{padding:9px 13px;font-size:14px;border:1.5px solid var(--hair);border-radius:5px;font-family:inherit;background:var(--panel);cursor:pointer;}
.count{font-size:13px;color:var(--soft);white-space:nowrap;}
.orders{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:20px;animation:fadeUp .3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.order-id{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.02em;}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 10px;border-radius:20px;color:#fff;}
.badge.new{background:var(--badge-new);}
.badge.ongoing{background:var(--badge-ongoing);}
.badge.done{background:var(--badge-done);}
.ts{font-size:12px;color:var(--soft);margin-left:auto;}
.card-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 16px;font-size:13px;margin-bottom:14px;}
.card-body .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:2px;}
.card-edit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;}
.card-edit .field{margin:0;}
.btn-save{padding:10px 18px;background:var(--sky);color:#F2EFE6;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;align-self:end;transition:background .2s,opacity .2s;}
.btn-save:hover{background:#162066;}
.btn-save:disabled{opacity:.6;cursor:default;}
.btn-save.saved{background:var(--ok);}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap;}
.pager button{padding:7px 13px;border:1.5px solid var(--hair);border-radius:4px;background:var(--panel);font-size:13px;cursor:pointer;font-family:inherit;transition:background .2s,border-color .2s;}
.pager button:hover{border-color:var(--focus);background:#EEF3FD;}
.pager button.active{background:var(--sky);color:#F2EFE6;border-color:var(--sky);}
.pager button:disabled{opacity:.4;cursor:default;}
.pager .info{font-size:13px;color:var(--soft);}
.empty{text-align:center;color:var(--soft);padding:40px 0;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>Jueh Tailoring</h1>
    <span class="admin-chip">Admin</span>
    <button class="btn-sm btn-logout" id="logoutBtn" style="display:none;">Log out</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- Gate -->
    <div class="wrap-gate" id="gate">
      <div class="panel">
        <h2>Access</h2>
        <p class="sub">Owner access manages orders. Admin access also controls the site.</p>
        <div class="gate-tabs">
          <button class="gate-tab active" data-tab="owner">Owner</button>
          <button class="gate-tab" data-tab="admin">Admin</button>
        </div>

        <!-- Owner tab -->
        <div class="gate-tab-pane active" id="tab-owner">
          <div class="gate-note">Owner access: view and update orders only.</div>
          <div class="field">
            <label for="ownerPc">Owner Passcode</label>
            <input type="password" id="ownerPc" placeholder="••••••" autocomplete="current-password">
          </div>
          <button class="btn-primary" id="ownerLoginBtn">Enter as Owner</button>
        </div>

        <!-- Admin tab -->
        <div class="gate-tab-pane" id="tab-admin">
          <div class="gate-note" style="background:#FFF0F0;border-color:#F5B0B0;color:#7A1818;">Admin access: site control + order management. Keep this passcode private.</div>
          <div class="field">
            <label for="adminPc">Admin Passcode</label>
            <input type="password" id="adminPc" placeholder="••••••" autocomplete="current-password">
          </div>
          <button class="btn-primary" id="adminLoginBtn">Enter as Admin</button>
        </div>

        <div class="err-msg" id="gateErr"></div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" style="display:none;">

      <!-- Site control (admin only) -->
      <div id="siteControl" style="display:none;">
        <div>
          <div class="sc-label">Site Status</div>
          <div class="sc-desc" id="scDesc">Loading…</div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-lbl" id="toggleLbl">—</span>
          <input type="checkbox" class="toggle" id="siteToggle">
        </div>
      </div>

      <!-- Orders -->
      <div class="toolbar">
        <input type="search" id="searchBox" placeholder="Search order ID, name, item…">
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="New">New</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Done">Done</option>
        </select>
        <span class="count" id="countLabel"></span>
      </div>
      <div class="orders" id="orderList"></div>
      <div class="pager" id="pager"></div>
    </div>

  </div>
</main>

<script>
const SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxCI7z5Q4ouI3XZhbcV2V5nKGIYe0QlGiMQnoRLzF804Zm6xoxc4QjdXFZs2IlJY0aS/exec';
const PAGE_SIZE = 20;

let allOrders = [], filtered = [], currentPage = 1;
let savedPasscode = '', apiPasscode = '', isAdmin = false, siteOpen = true, toggleBusy = false;

// Passcodes — must match your Apps Script
const OWNER_PC = 'OWNER';
const ADMIN_PC = 'ADMIN';

const $ = id => document.getElementById(id);

function callApi(action, params) {
  return new Promise(function(resolve, reject) {
    var cb = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    var qs = Object.assign({ action, callback: cb }, params || {});
    var url = SHEETS_WEBAPP_URL + '?' + Object.keys(qs).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(qs[k])).join('&');
    window[cb] = function(data) { delete window[cb]; sc.parentNode && sc.parentNode.removeChild(sc); resolve(data); };
    var sc = document.createElement('script');
    sc.src = url;
    sc.onerror = function() { delete window[cb]; sc.parentNode && sc.parentNode.removeChild(sc); reject(new Error('failed')); };
    document.body.appendChild(sc);
  });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? esc(v) : d.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
}

// Tab switching
document.querySelectorAll('.gate-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.gate-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.gate-tab-pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
    $('gateErr').textContent = '';
  });
});

// Login handlers
$('ownerLoginBtn').addEventListener('click', function() { doLogin($('ownerPc').value.trim(), false, $('ownerLoginBtn')); });
$('adminLoginBtn').addEventListener('click', function() { doLogin($('adminPc').value.trim(), true, $('adminLoginBtn')); });
$('ownerPc').addEventListener('keydown', e => { if (e.key === 'Enter') $('ownerLoginBtn').click(); });
$('adminPc').addEventListener('keydown', e => { if (e.key === 'Enter') $('adminLoginBtn').click(); });

function doLogin(pc, asAdmin, btn) {
  if (!pc) { $('gateErr').textContent = 'Enter your passcode.'; return; }

  // Admin: verify ADMIN passcode locally, then fetch orders with OWNER passcode
  if (asAdmin) {
    if (pc !== ADMIN_PC) { $('gateErr').textContent = 'Invalid passcode.'; return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    callApi('getOrders', { passcode: OWNER_PC }).then(function(res) {
      btn.disabled = false; btn.textContent = 'Enter as Admin';
      if (res.status !== 'ok') { $('gateErr').textContent = res.message || 'Could not load orders.'; return; }
      savedPasscode = ADMIN_PC; apiPasscode = OWNER_PC; isAdmin = true;
      sessionStorage.setItem('adminPc', ADMIN_PC);
      sessionStorage.setItem('adminRole', '1');
      showDashboard(res.orders || []);
    }).catch(function() {
      btn.disabled = false; btn.textContent = 'Enter as Admin';
      $('gateErr').textContent = 'Connection error. Try again.';
    });
    return;
  }

  // Owner: send passcode directly
  btn.disabled = true; btn.textContent = 'Checking…';
  callApi('getOrders', { passcode: pc }).then(function(res) {
    btn.disabled = false; btn.textContent = 'Enter as Owner';
    if (res.status !== 'ok') { $('gateErr').textContent = res.message || 'Wrong passcode.'; return; }
    savedPasscode = pc; apiPasscode = pc; isAdmin = false;
    sessionStorage.setItem('adminPc', pc);
    sessionStorage.setItem('adminRole', '0');
    showDashboard(res.orders || []);
  }).catch(function() {
    btn.disabled = false; btn.textContent = 'Enter as Owner';
    $('gateErr').textContent = 'Connection error. Try again.';
  });
}

function showDashboard(orders) {
  $('gate').style.display = 'none';
  $('dashboard').style.display = 'block';
  $('logoutBtn').style.display = '';
  allOrders = orders;

  if (isAdmin) {
    $('siteControl').style.display = 'flex';
    loadSiteStatus();
    setupToggle();
  }

  applyFilters();
}

// Site status
function loadSiteStatus() {
  $('scDesc').textContent = 'Loading…';
  callApi('getSiteStatus', {}).then(function(res) {
    if (res && res.status === 'ok') {
      siteOpen = res.open !== false;
      updateToggleUI();
    }
  }).catch(function() { $('scDesc').textContent = 'Could not load status.'; });
}

function updateToggleUI() {
  $('siteToggle').checked = siteOpen;
  $('toggleLbl').textContent = siteOpen ? 'Open' : 'Closed';
  $('scDesc').textContent = siteOpen ? 'Accepting new orders.' : 'Orders are paused — customers see a closed banner.';
}

function setupToggle() {
  $('siteToggle').addEventListener('change', function() {
    if (toggleBusy) { $('siteToggle').checked = siteOpen; return; }
    const newOpen = $('siteToggle').checked;
    if (!confirm(newOpen ? 'Open the site to orders?' : 'Close the site? Customers will see a "closed" message.')) {
      $('siteToggle').checked = siteOpen; return;
    }
    toggleBusy = true;
    $('scDesc').textContent = 'Updating…';
    callApi('setSiteStatus', { passcode: savedPasscode, open: newOpen ? 'true' : 'false' }).then(function(res) {
      toggleBusy = false;
      if (res && res.status === 'ok') { siteOpen = newOpen; updateToggleUI(); }
      else { $('siteToggle').checked = siteOpen; $('scDesc').textContent = 'Update failed.'; }
    }).catch(function() {
      toggleBusy = false;
      $('siteToggle').checked = siteOpen;
      $('scDesc').textContent = 'Connection error.';
    });
  });
}

// Orders
function applyFilters() {
  const q = $('searchBox').value.trim().toLowerCase();
  const st = $('filterStatus').value;
  filtered = allOrders.filter(function(o) {
    const matchSt = !st || o['Status'] === st || (!o['Status'] && st === 'New');
    const matchQ = !q || JSON.stringify(o).toLowerCase().includes(q);
    return matchSt && matchQ;
  });
  currentPage = 1;
  render();
}

function render() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  currentPage = Math.min(currentPage, pages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  $('countLabel').textContent = total + ' order' + (total !== 1 ? 's' : '');

  const list = $('orderList');
  if (!total) { list.innerHTML = '<div class="empty">No orders found.</div>'; $('pager').innerHTML = ''; return; }

  list.innerHTML = slice.map(function(o, i) {
    const st = o['Status'] || 'New';
    const cls = st === 'Ongoing' ? 'ongoing' : st === 'Done' ? 'done' : 'new';
    const idx = start + i;
    return `<div class="card" style="animation-delay:${i*0.04}s">
      <div class="card-head">
        <span class="order-id">${esc(o['Order ID'] || '—')}</span>
        <span class="badge ${cls}">${esc(st)}</span>
        <span class="ts">${fmtDate(o['Timestamp'])}</span>
      </div>
      <div class="card-body">
        <div><span class="lbl">Name</span>${esc(o['Name'] || '—')}</div>
        <div><span class="lbl">Contact</span>${esc(o['Contact'] || '—')}</div>
        <div><span class="lbl">Item</span>${esc(o['Item Type'] || '—')}</div>
        <div><span class="lbl">Qty</span>${esc(o['Quantity'] || '—')}</div>
        <div><span class="lbl">Needed by</span>${esc(o['Needed By'] || '—')}</div>
      </div>
      <div class="card-edit">
        <div class="field">
          <label>Status</label>
          <select class="st-sel" data-idx="${idx}">
            <option ${st==='New'?'selected':''}>New</option>
            <option ${st==='Ongoing'?'selected':''}>Ongoing</option>
            <option ${st==='Done'?'selected':''}>Done</option>
          </select>
        </div>
        <div class="field" style="grid-column:1/-1">
          <label>Note to customer</label>
          <textarea class="note-ta" data-idx="${idx}" placeholder="Leave a note visible to the customer…">${esc(o['Owner Note'] || '')}</textarea>
        </div>
        <div></div>
        <button class="btn-save" data-idx="${idx}">Save</button>
      </div>
    </div>`;
  }).join('');

  renderPager(pages);

  list.querySelectorAll('.btn-save').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.disabled) return;
      const idx = parseInt(btn.dataset.idx);
      const card = btn.closest('.card');
      const newSt = card.querySelector('.st-sel').value;
      const note = card.querySelector('.note-ta').value.trim();
      const orderId = filtered[idx]['Order ID'];
      btn.disabled = true; btn.textContent = 'Saving…';
      callApi('updateOrder', { passcode: apiPasscode, orderId, status: newSt, note }).then(function(res) {
        btn.disabled = false;
        if (res.status === 'ok') {
          filtered[idx]['Status'] = newSt; filtered[idx]['Owner Note'] = note;
          const orig = allOrders.find(o => o['Order ID'] === orderId);
          if (orig) { orig['Status'] = newSt; orig['Owner Note'] = note; }
          btn.textContent = '✓ Saved'; btn.classList.add('saved');
          setTimeout(function() { btn.textContent = 'Save'; btn.classList.remove('saved'); }, 2000);
        } else { btn.textContent = 'Save'; alert(res.message || 'Save failed.'); }
      }).catch(function() { btn.disabled = false; btn.textContent = 'Save'; alert('Connection error.'); });
    });
  });
}

function renderPager(pages) {
  const pg = $('pager');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  let html = `<button ${currentPage===1?'disabled':''} data-p="${currentPage-1}">‹ Prev</button>`;
  for (let p = 1; p <= pages; p++) {
    if (pages > 7 && p > 2 && p < pages-1 && Math.abs(p-currentPage) > 1) {
      if (p === 3 || p === pages-2) html += '<span class="info">…</span>';
      continue;
    }
    html += `<button class="${p===currentPage?'active':''}" data-p="${p}">${p}</button>`;
  }
  html += `<button ${currentPage===pages?'disabled':''} data-p="${currentPage+1}">Next ›</button>`;
  pg.innerHTML = html;
  pg.querySelectorAll('button[data-p]').forEach(function(b) {
    b.addEventListener('click', function() {
      currentPage = parseInt(b.dataset.p);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

$('searchBox').addEventListener('input', applyFilters);
$('filterStatus').addEventListener('change', applyFilters);

$('logoutBtn').addEventListener('click', function() {
  sessionStorage.removeItem('adminPc');
  sessionStorage.removeItem('adminRole');
  savedPasscode = ''; isAdmin = false;
  $('dashboard').style.display = 'none';
  $('gate').style.display = '';
  $('logoutBtn').style.display = 'none';
  $('ownerPc').value = ''; $('adminPc').value = '';
  $('gateErr').textContent = '';
});

// Session restore
(function() {
  const pc = sessionStorage.getItem('adminPc');
  const role = sessionStorage.getItem('adminRole');
  if (!pc) return;
  isAdmin = role === '1';
  savedPasscode = pc;
  apiPasscode = isAdmin ? OWNER_PC : pc;
  callApi('getOrders', { passcode: apiPasscode }).then(function(res) {
    if (res.status === 'ok') showDashboard(res.orders || []);
  }).catch(function() {});
})();
</script>
</body>
</html>
