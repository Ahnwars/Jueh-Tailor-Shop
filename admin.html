<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Jueh Tailoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --sky-top: #0B1345;
    --horizon: #E89A4C;
    --horizon-deep: #C15A3A;
    --canvas: #F7F4EC;
    --canvas-panel: #FFFFFF;
    --ink: #101418;
    --ink-soft: #4B5563;
    --hairline: #DDD6C4;
    --focus: #2F6FED;
    --ok: #1B7A43;
    --err: #B3261E;
    --new: #2F6FED;
    --ongoing: #C15A3A;
    --done: #1B7A43;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, .display { font-family: 'Oswald', 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.05; margin: 0; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .narrow { max-width: 560px; margin: 0 auto; }

  header { background: var(--sky-top); color: #F2EFE6; border-bottom: 3px solid var(--horizon); padding: 16px 24px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; padding: 0; }
  header h1 { font-size: 18px; }
  header a.back { font-size: 13px; color: #D9DEE8; text-decoration: none; }
  header a.back:hover { color: #fff; }

  main { padding: 40px 0 80px; }

  .gate { max-width: 360px; margin: 80px auto 0; background: var(--canvas-panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 32px; text-align: center; }
  .gate h2 { font-size: 22px; margin-bottom: 8px; }
  .gate p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .gate input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--hairline); border-radius: 4px; margin-bottom: 12px; font-family: inherit; }
  .gate input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .gate button { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--horizon-deep), var(--horizon)); color: #1A1206; border: none; border-radius: 4px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .gate .err { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #adminView { display: none; }

  /* Site control panel */
  .control-panel { background: var(--canvas-panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 28px 32px; text-align: center; margin-bottom: 32px; }
  .control-panel h2 { font-size: 20px; margin-bottom: 4px; }
  .control-panel p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; }
  .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 30px; font-weight: 700; font-size: 14px; margin-bottom: 18px; }
  .status-pill.open { background: #E4F3E9; color: var(--ok); }
  .status-pill.closed { background: #FBE8E7; color: var(--err); }
  .status-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .toggle-btn { display: inline-block; padding: 12px 28px; font-family: inherit; font-size: 15px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; color: #fff; }
  .toggle-btn.to-close { background: var(--err); }
  .toggle-btn.to-open { background: var(--ok); }
  .toggle-btn:disabled { opacity: .6; cursor: default; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 16px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }

  /* Orders section (same style as owner dashboard) */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar h2 { font-size: 22px; }
  .toolbar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .toolbar button, .toolbar input[type="search"], .toolbar select {
    font-family: inherit; font-size: 14px; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--hairline); background: var(--canvas-panel); cursor: pointer;
  }
  .toolbar input[type="search"] { cursor: text; min-width: 200px; }
  .toolbar button.refresh { color: var(--ink); }
  .toolbar button.logout { color: var(--err); border-color: var(--err); }

  .status-line { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }

  .order-list { display: flex; flex-direction: column; gap: 12px; }
  .order-card { background: var(--canvas-panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 18px 20px; }
  .order-card .row1 { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .order-card .name { font-weight: 700; font-size: 16px; }
  .order-card .order-id { font-size: 12px; color: var(--ink-soft); font-family: monospace; }
  .order-card .timestamp { color: var(--ink-soft); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 10px; border-radius: 20px; color: #fff; }
  .badge.new { background: var(--new); }
  .badge.ongoing { background: var(--ongoing); }
  .badge.done { background: var(--done); }
  .order-card .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 20px; font-size: 14px; margin: 10px 0; }
  .order-card .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 2px; }
  .order-card .details-full { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: 14px; white-space: pre-wrap; }

  .edit-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
  .edit-row select { font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--hairline); }
  .edit-row textarea { flex: 1; min-width: 200px; font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--hairline); resize: vertical; min-height: 40px; }
  .edit-row button { font-family: inherit; font-size: 14px; padding: 9px 16px; border-radius: 4px; border: none; background: var(--sky-top); color: #fff; cursor: pointer; }
  .edit-row button:disabled { opacity: .6; cursor: default; }
  .save-msg { font-size: 12px; color: var(--ok); margin-top: 6px; min-height: 14px; }

  .empty, .loading { text-align: center; color: var(--ink-soft); padding: 60px 20px; font-size: 15px; }

  .logout-row { text-align: center; margin-top: 24px; }
  .logout-row button { background: none; border: 1px solid var(--hairline); color: var(--err); border-color: var(--err); font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Jueh Tailoring — Admin</h1>
    <a class="back" href="tailoring-shop.html">← Back to site</a>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="gate" id="gate">
      <h2>Enter admin passcode</h2>
      <p>Full site control and order access.</p>
      <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off">
      <button id="loginBtn">Continue</button>
      <div class="err" id="gateErr"></div>
    </div>

    <div id="adminView">

      <div class="control-panel narrow">
        <h2>Ordering Status</h2>
        <p class="sub">Control whether customers can submit new orders.</p>
        <div id="pillWrap"></div>
        <div><button id="toggleBtn" class="toggle-btn"></button></div>
        <div class="msg" id="msgLine"></div>
      </div>

      <div class="toolbar">
        <h2>Orders</h2>
        <div class="actions">
          <input type="search" id="searchBox" placeholder="Search name, item, contact...">
          <select id="filterSelect">
            <option value="">All statuses</option>
            <option value="New">New</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Done">Done</option>
          </select>
          <button class="refresh" id="refreshBtn">Refresh</button>
        </div>
      </div>
      <div class="status-line" id="statusLine"></div>
      <div id="listContainer"></div>

      <div class="logout-row"><button id="logoutBtn">Log out</button></div>
    </div>

  </div>
</main>

<script>
  // ---- EDIT THIS with your deployed Apps Script web app URL ----
  const SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyHen3-Ifrt8D_D91V0TgE4zzPrpStrf-LzvUvIg6Jm0mO6fW89iDEGJ9K8tV53Lved/exec'; // ends in /exec
  // ----------------------------------------------------------------

  const gate = document.getElementById('gate');
  const adminView = document.getElementById('adminView');
  const passcodeInput = document.getElementById('passcodeInput');
  const loginBtn = document.getElementById('loginBtn');
  const gateErr = document.getElementById('gateErr');
  const pillWrap = document.getElementById('pillWrap');
  const toggleBtn = document.getElementById('toggleBtn');
  const msgLine = document.getElementById('msgLine');
  const statusLine = document.getElementById('statusLine');
  const listContainer = document.getElementById('listContainer');
  const searchBox = document.getElementById('searchBox');
  const filterSelect = document.getElementById('filterSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  let currentPasscode = '';
  let siteOpen = true;
  let allOrders = [];

  function callApi(action, params) {
    return new Promise(function(resolve, reject) {
      var cbName = 'jsonp_' + Date.now() + '_' + Math.floor(Math.random()*9999);
      var qs = Object.assign({ action: action, callback: cbName }, params || {});
      var url = SHEETS_WEBAPP_URL + '?' + Object.keys(qs).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]);
      }).join('&');
      window[cbName] = function(data) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };
      var script = document.createElement('script');
      script.src = url;
      script.onerror = function() {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('Request failed'));
      };
      document.body.appendChild(script);
    });
  }

  currentPasscode = sessionStorage.getItem('jueh_admin_passcode') || '';
  if (currentPasscode) tryLogin(currentPasscode, true);

  loginBtn.addEventListener('click', () => attempt());
  passcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });

  function attempt() {
    const val = passcodeInput.value.trim();
    if (!val) return;
    tryLogin(val, false);
  }

  function tryLogin(passcode, silentFail) {
    if (!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.indexOf('PASTE_YOUR') !== -1) {
      gateErr.textContent = 'This page isn\'t connected yet — the web app URL still needs to be set.';
      return;
    }
    gateErr.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';

    // getOrders itself validates the passcode (accepts owner OR admin passcode).
    callApi('getOrders', { passcode: passcode }).then(data => {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Continue';
      if (data.status === 'ok') {
        currentPasscode = passcode;
        sessionStorage.setItem('jueh_admin_passcode', passcode);
        allOrders = data.orders || [];
        loadSiteStatusThenShow();
      } else if (!silentFail) {
        gateErr.textContent = data.message || 'Incorrect passcode.';
      } else {
        sessionStorage.removeItem('jueh_admin_passcode');
      }
    }).catch(() => {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Continue';
      if (!silentFail) gateErr.textContent = 'Could not reach the order system. Check your connection.';
    });
  }

  function loadSiteStatusThenShow() {
    callApi('getSiteStatus', {}).then(data => {
      if (data && data.status === 'ok') siteOpen = data.open;
      showAdmin();
    }).catch(() => showAdmin());
  }

  function showAdmin() {
    gate.style.display = 'none';
    adminView.style.display = 'block';
    renderStatus();
    applyFilters();
  }

  function renderStatus() {
    pillWrap.innerHTML = siteOpen
      ? '<div class="status-pill open"><span class="dot"></span> Site is OPEN — accepting orders</div>'
      : '<div class="status-pill closed"><span class="dot"></span> Site is CLOSED — orders paused</div>';
    toggleBtn.className = siteOpen ? 'toggle-btn to-close' : 'toggle-btn to-open';
    toggleBtn.textContent = siteOpen ? 'Close ordering' : 'Reopen ordering';
  }

  toggleBtn.addEventListener('click', () => {
    const newState = !siteOpen;
    toggleBtn.disabled = true;
    msgLine.textContent = '';
    callApi('setSiteStatus', { passcode: currentPasscode, open: newState }).then(res => {
      toggleBtn.disabled = false;
      if (res.status === 'ok') {
        siteOpen = newState;
        renderStatus();
        msgLine.className = 'msg ok';
        msgLine.textContent = 'Updated.';
      } else {
        msgLine.className = 'msg err';
        msgLine.textContent = res.message || 'Could not update — this passcode may not have site-control access.';
      }
    }).catch(() => {
      toggleBtn.disabled = false;
      msgLine.className = 'msg err';
      msgLine.textContent = 'Connection error — try again.';
    });
  });

  // ---- Orders list (same behavior as owner.html) ----

  function currentFiltered() {
    const q = searchBox.value.trim().toLowerCase();
    const statusFilter = filterSelect.value;
    return allOrders.filter(o => {
      const matchesQ = !q || Object.values(o).some(v => String(v || '').toLowerCase().includes(q));
      const matchesStatus = !statusFilter || (o['Status'] || 'New') === statusFilter;
      return matchesQ && matchesStatus;
    });
  }

  function applyFilters() { renderOrders(currentFiltered()); }

  function renderOrders(orders) {
    statusLine.textContent = orders.length + ' order' + (orders.length === 1 ? '' : 's') +
      ' (of ' + allOrders.length + ' total)';
    if (orders.length === 0) {
      listContainer.innerHTML = '<div class="empty">No matching orders.</div>';
      return;
    }
    listContainer.innerHTML = '<div class="order-list">' + orders.map(orderCardHtml).join('') + '</div>';
    orders.forEach(o => {
      const id = o['OrderID'];
      const saveBtn = document.getElementById('save_' + cssSafe(id));
      if (saveBtn) saveBtn.addEventListener('click', () => saveOrder(id));
    });
  }

  function cssSafe(id) { return String(id).replace(/[^a-zA-Z0-9]/g, '_'); }
  function esc(str) { return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmtDate(val) {
    if (!val) return '—';
    const d = new Date(val);
    if (isNaN(d.getTime())) return esc(val);
    return d.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
  }
  function badgeHtml(status) {
    const s = status || 'New';
    const cls = s === 'Ongoing' ? 'ongoing' : (s === 'Done' ? 'done' : 'new');
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }
  function field(label, value) { return '<div class="field"><label>' + esc(label) + '</label>' + esc(value || '—') + '</div>'; }

  function orderCardHtml(o) {
    const id = o['OrderID'];
    const safeId = cssSafe(id);
    const status = o['Status'] || 'New';
    return '' +
      '<div class="order-card">' +
        '<div class="row1">' +
          '<span class="name">' + esc(o['Name']) + '</span>' +
          badgeHtml(status) +
          '<span class="timestamp">' + fmtDate(o['Timestamp']) + '</span>' +
        '</div>' +
        '<div class="order-id">Order ID: ' + esc(id) + '</div>' +
        '<div class="grid">' +
          field('Contact', o['Contact']) +
          field('Item Type', o['Item Type']) +
          field('Quantity', o['Quantity']) +
          field('Sizes', o['Sizes']) +
          field('Needed By', o['Needed By']) +
          field('Budget Range', o['Budget Range']) +
        '</div>' +
        (o['Design Details'] ? '<div class="details-full"><label style="text-transform:uppercase;font-size:11px;color:var(--ink-soft);letter-spacing:.04em;">Design Details</label><br>' + esc(o['Design Details']) + '</div>' : '') +
        '<div class="edit-row">' +
          '<select id="status_' + safeId + '">' +
            ['New', 'Ongoing', 'Done'].map(s => '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>').join('') +
          '</select>' +
          '<textarea id="note_' + safeId + '" placeholder="Reply / note for this order...">' + esc(o['Owner Note']) + '</textarea>' +
          '<button id="save_' + safeId + '">Save</button>' +
        '</div>' +
        '<div class="save-msg" id="savemsg_' + safeId + '"></div>' +
      '</div>';
  }

  function saveOrder(orderId) {
    const safeId = cssSafe(orderId);
    const statusSel = document.getElementById('status_' + safeId);
    const noteEl = document.getElementById('note_' + safeId);
    const btn = document.getElementById('save_' + safeId);
    const msg = document.getElementById('savemsg_' + safeId);

    btn.disabled = true;
    btn.textContent = 'Saving...';
    msg.textContent = '';
    msg.style.color = 'var(--ok)';

    callApi('updateOrder', {
      passcode: currentPasscode,
      orderId: orderId,
      status: statusSel.value,
      note: noteEl.value
    }).then(res => {
      btn.disabled = false;
      btn.textContent = 'Save';
      if (res.status === 'ok') {
        msg.textContent = 'Saved.';
        const o = allOrders.find(x => x['OrderID'] === orderId);
        if (o) { o['Status'] = statusSel.value; o['Owner Note'] = noteEl.value; }
      } else {
        msg.style.color = 'var(--err)';
        msg.textContent = res.message || 'Could not save.';
      }
    }).catch(() => {
      btn.disabled = false;
      btn.textContent = 'Save';
      msg.style.color = 'var(--err)';
      msg.textContent = 'Connection error — try again.';
    });
  }

  refreshBtn.addEventListener('click', () => { if (currentPasscode) tryLogin(currentPasscode, false); });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('jueh_admin_passcode');
    currentPasscode = '';
    allOrders = [];
    passcodeInput.value = '';
    adminView.style.display = 'none';
    gate.style.display = 'block';
  });

  searchBox.addEventListener('input', applyFilters);
  filterSelect.addEventListener('change', applyFilters);
</script>

</body>
</html>
