<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check Your Order — Jueh Tailoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --sky-top: #0B1345;
    --horizon: #E89A4C;
    --horizon-deep: #C15A3A;
    --canvas: #F7F4EC;
    --canvas-panel: #FFFFFF;
    --ink: #101418;
    --ink-soft: #4B5563;
    --hairline: #DDD6C4;
    --focus: #2F6FED;
    --ok: #1B7A43;
    --err: #B3261E;
    --new: #2F6FED;
    --ongoing: #C15A3A;
    --done: #1B7A43;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, .display { font-family: 'Oswald', 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.05; margin: 0; }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--sky-top); color: #F2EFE6; border-bottom: 3px solid var(--horizon); padding: 16px 24px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; padding: 0; max-width: 1120px; }
  header h1 { font-size: 18px; }
  header a.back { font-size: 13px; color: #D9DEE8; text-decoration: none; }
  header a.back:hover { color: #fff; }

  main { padding: 60px 0 80px; }

  .panel { background: var(--canvas-panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 32px; }
  .panel h2 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  .panel p.sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 24px; text-align: center; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--hairline); border-radius: 4px; font-family: inherit; }
  .field input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  button.check { width: 100%; padding: 13px; margin-top: 6px; background: linear-gradient(90deg, var(--horizon-deep), var(--horizon)); color: #1A1206; border: none; border-radius: 4px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  button.check:disabled { opacity: .6; cursor: default; }

  .err-msg { color: var(--err); font-size: 13px; margin-top: 12px; text-align: center; min-height: 16px; }

  .result { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hairline); display: none; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 4px 12px; border-radius: 20px; color: #fff; margin-bottom: 14px; }
  .badge.new { background: var(--new); }
  .badge.ongoing { background: var(--ongoing); }
  .badge.done { background: var(--done); }

  .result .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 20px; font-size: 14px; margin-bottom: 16px; }
  .result .grid label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin-bottom: 2px; }

  .owner-note { background: #F1F0E9; border-radius: 6px; padding: 14px 16px; font-size: 14px; white-space: pre-wrap; }
  .owner-note label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin-bottom: 4px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Jueh Tailoring</h1>
    <a class="back" href="tailoring-shop.html">← Back to site</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <h2>Check Your Order</h2>
      <p class="sub">Enter the Order ID you received after ordering, along with the same phone/email you used.</p>

      <div class="field">
        <label for="orderId">Order ID</label>
        <input type="text" id="orderId" placeholder="e.g. JT-260926-1234" autocomplete="off">
      </div>
      <div class="field">
        <label for="contact">Phone or email used at order</label>
        <input type="text" id="contact" autocomplete="off">
      </div>
      <button class="check" id="checkBtn">Check Status</button>
      <div class="err-msg" id="errMsg"></div>

      <div class="result" id="result">
        <div id="badgeWrap"></div>
        <div class="grid" id="detailGrid"></div>
        <div class="owner-note" id="noteWrap" style="display:none;">
          <label>Note from Jueh Tailoring</label>
          <div id="noteText"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  // ---- EDIT THIS with your deployed Apps Script web app URL ----
  const SHEETS_WEBAPP_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'; // ends in /exec
  // ----------------------------------------------------------------

  const orderIdInput = document.getElementById('orderId');
  const contactInput = document.getElementById('contact');
  const checkBtn = document.getElementById('checkBtn');
  const errMsg = document.getElementById('errMsg');
  const result = document.getElementById('result');
  const badgeWrap = document.getElementById('badgeWrap');
  const detailGrid = document.getElementById('detailGrid');
  const noteWrap = document.getElementById('noteWrap');
  const noteText = document.getElementById('noteText');

  function callApi(action, params) {
    return fetch(SHEETS_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params))
    }).then(r => r.json());
  }

  function esc(str) {
    return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function fmtDate(val) {
    if (!val) return '—';
    const d = new Date(val);
    if (isNaN(d.getTime())) return esc(val);
    return d.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function field(label, value) {
    return '<div><label>' + esc(label) + '</label>' + esc(value || '—') + '</div>';
  }

  checkBtn.addEventListener('click', () => {
    const orderId = orderIdInput.value.trim();
    const contact = contactInput.value.trim();
    errMsg.textContent = '';
    result.style.display = 'none';

    if (!orderId || !contact) {
      errMsg.textContent = 'Please enter both your Order ID and contact info.';
      return;
    }
    if (!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.indexOf('PASTE_YOUR') !== -1) {
      errMsg.textContent = 'Order lookup isn\'t connected yet — please message us directly.';
      return;
    }

    checkBtn.disabled = true;
    checkBtn.textContent = 'Checking...';

    callApi('lookupOrder', { orderId: orderId, contact: contact }).then(res => {
      checkBtn.disabled = false;
      checkBtn.textContent = 'Check Status';
      if (res.status !== 'ok') {
        errMsg.textContent = res.message || 'Order not found.';
        return;
      }
      const o = res.order;
      const status = o['Status'] || 'New';
      const cls = status === 'Ongoing' ? 'ongoing' : (status === 'Done' ? 'done' : 'new');
      badgeWrap.innerHTML = '<span class="badge ' + cls + '">' + esc(status) + '</span>';
      detailGrid.innerHTML =
        field('Item', o['Item Type']) +
        field('Quantity', o['Quantity']) +
        field('Ordered on', fmtDate(o['Timestamp'])) +
        field('Needed by', o['Needed By']);
      if (o['Owner Note']) {
        noteWrap.style.display = 'block';
        noteText.textContent = o['Owner Note'];
      } else {
        noteWrap.style.display = 'none';
      }
      result.style.display = 'block';
    }).catch(() => {
      checkBtn.disabled = false;
      checkBtn.textContent = 'Check Status';
      errMsg.textContent = 'Could not reach the order system. Check your connection and try again.';
    });
  });

  orderIdInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkBtn.click(); });
  contactInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkBtn.click(); });
</script>

</body>
</html>
