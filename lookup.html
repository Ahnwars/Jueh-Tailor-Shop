<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check Your Order — Jueh Tailoring</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="page-title">Jueh Tailoring</h1>
    <a class="back-link" href="index.html">← Back to site</a>
  </div>
</header>

<main>
  <div class="narrow">
    <div class="card">
      <h2>Check Your Order</h2>
      <p class="intro">Enter the Order ID you received, along with the phone or email you used.</p>

      <div class="field">
        <label for="order-id">Order ID</label>
        <input type="text" id="order-id" placeholder="e.g. JT-260926-1234" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="contact">Phone or email used at order</label>
        <input type="text" id="contact" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-block" id="check-btn">Check Status</button>
      <div class="error-text" id="lookup-error"></div>

      <div class="lookup-result" id="result">
        <div id="badge-wrap"></div>
        <dl class="detail-grid" id="detail-grid"></dl>
        <div class="note-box hidden" id="note-box">
          <span class="label">Note from Jueh Tailoring</span>
          <div id="note-text"></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-dark" id="copy-btn">Copy Order ID</button>
          <a class="btn btn-line" href="index.html">+ Place Another Order</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/lookup.js"></script>
</body>
</html>
